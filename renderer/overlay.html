<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Doctor PC — overlay</title>
  <style>
    /* Sin fondo: solo números con contorno negro para que se lean sobre cualquier juego */
    html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
    .panel{display:inline-block;padding:4px 6px;border-radius:6px;color:#fff;
      text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 3px rgba(0,0,0,.85)}
    .panel.alerta{outline:2px solid #ef4444;outline-offset:1px;animation:latir 1s ease-in-out 6}
    .fila{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:6px;margin-top:2px}
    .fila:first-child{margin-top:0}
    .eti{font-size:11px;font-weight:800;letter-spacing:.4px;min-width:30px}
    .eti.fps{color:#f9a8d4}.eti.cpu{color:#60a5fa}.eti.gpu{color:#4ade80}.eti.ram{color:#fbbf24}.eti.vram{color:#c084fc}
    .vals{display:flex;gap:7px;align-items:baseline;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;line-height:1.05;white-space:nowrap}
    .vals small{font-size:9.5px;font-weight:700;color:#e5e7eb;margin-left:1px}
    .vals .grande{font-size:17px}
    .vals .bajo{font-size:10px;color:#e5e7eb}
    .vals .aviso{font-size:9.5px;color:#d1d5db;font-weight:600}
    .t.calido{color:#fde047}.t.caliente{color:#fb923c}.t.peligro{color:#f87171;animation:parpadeo 1s steps(2) infinite}
    svg{grid-column:2;width:64px;height:9px;display:block;margin-top:1px;overflow:visible}
    svg .halo{fill:none;stroke:rgba(0,0,0,.85);stroke-width:3.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
    svg .linea{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
    .oculto{display:none}
    body.pequeno .eti{font-size:9.5px;min-width:26px}
    body.pequeno .vals{font-size:12px;gap:5px}
    body.pequeno .vals .grande{font-size:14px}
    body.pequeno svg{width:50px;height:7px}
    @keyframes parpadeo{50%{opacity:.45}}
    @keyframes latir{50%{outline-color:rgba(239,68,68,.35)}}
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="fila oculto" id="fila-fps"><span class="eti fps">FPS</span><div class="vals"><span class="grande" id="fps">–</span><span class="bajo" id="fpsBajo"></span></div><svg id="g-fps" viewBox="0 0 100 10" preserveAspectRatio="none"></svg></div>
    <div class="fila"><span class="eti cpu">CPU</span><div class="vals"><span id="cpu">–</span><span class="t" id="cpuT"></span></div><svg id="g-cpu" viewBox="0 0 100 10" preserveAspectRatio="none"></svg></div>
    <div class="fila"><span class="eti gpu">GPU</span><div class="vals"><span id="gpu">–</span><span class="t" id="gpuT"></span></div><svg id="g-gpu" viewBox="0 0 100 10" preserveAspectRatio="none"></svg></div>
    <div class="fila"><span class="eti ram">RAM</span><div class="vals"><span id="ram">–</span><span id="ramP"></span></div><svg id="g-ram" viewBox="0 0 100 10" preserveAspectRatio="none"></svg></div>
    <div class="fila oculto" id="fila-vram"><span class="eti vram">VRAM</span><div class="vals"><span id="vram">–</span><span id="vramP"></span></div><svg id="g-vram" viewBox="0 0 100 10" preserveAspectRatio="none"></svg></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
