name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar la app
        run: npm test

      - name: Probar el motor con Windows PowerShell 5.1 (incluye un análisis real del equipo)
        shell: powershell
        run: ./tests/Test-Motor.ps1

      - name: Probar el motor con PowerShell 7
        shell: pwsh
        run: ./tests/Test-Motor.ps1
