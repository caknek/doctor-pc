name: Publicar versión

# Publica una versión nueva cuando cambia "version" en package.json (push a main),
# o manualmente desde la pestaña Actions. Si la versión ya está publicada, no hace nada.
# La app instalada la detecta y ofrece actualizar con su botón.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Solo cuenta como publicada si existe y no es borrador (un borrador se reutiliza)
          $borrador = gh release view "v$v" --repo '${{ github.repository }}' --json isDraft -q .isDraft 2>$null
          $existe = ($LASTEXITCODE -eq 0 -and "$borrador".Trim() -eq 'false')
          "version=$v" >> $env:GITHUB_OUTPUT
          "existe=$($existe.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($existe) { Write-Host "v$v ya está publicada: no hay nada que hacer." } else { Write-Host "Se publicará v$v" }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.version.outputs.existe == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.version.outputs.existe == 'false'
        run: npm ci

      - name: Compilar el lector de sensores
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: ./scripts/compilar-sensores.ps1

      - name: Comprobar la app (incluye que la versión del motor coincida)
        if: steps.version.outputs.existe == 'false'
        run: npm test

      - name: Probar el motor (Windows PowerShell 5.1)
        if: steps.version.outputs.existe == 'false'
        shell: powershell
        run: ./tests/Test-Motor.ps1

      - name: Crear la etiqueta de la versión
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $t = 'v${{ steps.version.outputs.version }}'
          git fetch --tags --quiet
          if (-not (git tag -l $t)) {
            git tag $t
            git push origin $t
          }
          # Crear el borrador antes de compilar: así electron-builder lo reutiliza y no crea dos a la vez
          $hay = gh api "repos/${{ github.repository }}/releases?per_page=50" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $t }
          if (-not $hay) { gh release create $t --draft --title "Doctor PC ${{ steps.version.outputs.version }}" --notes-file build/release-notes.md --repo '${{ github.repository }}' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar el instalador y publicarlo en Releases
        if: steps.version.outputs.existe == 'false'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Añadir la versión de consola y hacer pública la versión
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $t = "v$v"
          $repo = '${{ github.repository }}'
          $dir = 'dist/DoctorPC-Consola'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item engine/* $dir -Recurse
          Compress-Archive -Path "$dir/*" -DestinationPath dist/DoctorPC-Consola.zip -Force
          $todas = @(gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json)
          # electron-builder a veces deja dos borradores con la misma etiqueta: se usa el que tiene el instalador y latest.yml
          $borradores = @($todas | Where-Object { $_.tag_name -eq $t -and $_.draft })
          $buena = $borradores | Where-Object { @($_.assets.name) -contains 'DoctorPC-Instalador.exe' -and @($_.assets.name) -contains 'latest.yml' } | Select-Object -First 1
          if (-not $buena) { throw "Ningún borrador de $t tiene DoctorPC-Instalador.exe y latest.yml" }
          foreach ($r in $borradores) { if ($r.id -ne $buena.id) { gh api -X DELETE "repos/$repo/releases/$($r.id)"; Write-Host "Borrador duplicado eliminado ($($r.id))" } }
          foreach ($f in @('dist/DoctorPC-Consola.zip', 'dist/DoctorPC-Instalador.exe.blockmap')) {
            if (-not (Test-Path $f)) { continue }
            $n = Split-Path $f -Leaf
            $previo = $buena.assets | Where-Object { $_.name -eq $n }
            if ($previo) { gh api -X DELETE "repos/$repo/releases/assets/$($previo.id)" }
            gh api -X POST -H 'Content-Type: application/octet-stream' "https://uploads.github.com/repos/$repo/releases/$($buena.id)/assets?name=$n" --input $f | Out-Null
            Write-Host "Subido $n"
          }
          gh api -X PATCH "repos/$repo/releases/$($buena.id)" -F draft=false -f make_latest=true -f name="Doctor PC $v" -F body=@build/release-notes.md | Out-Null
          # Limpiar borradores viejos de versiones que ya están publicadas
          foreach ($r in $todas) {
            if ($r.draft -and $r.id -ne $buena.id -and $r.tag_name -ne $t -and ($todas | Where-Object { $_.tag_name -eq $r.tag_name -and -not $_.draft })) {
              gh api -X DELETE "repos/$repo/releases/$($r.id)"; Write-Host "Borrador sobrante de $($r.tag_name) eliminado"
            }
          }
          $assets = gh release view $t --repo $repo --json assets -q '.assets[].name'
          foreach ($a in 'DoctorPC-Instalador.exe', 'latest.yml') { if ($assets -notcontains $a) { throw "Falta $a en el release publicado" } }
          Write-Host "Publicada $t"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
