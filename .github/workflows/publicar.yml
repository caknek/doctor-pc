name: Publicar versión

# Publica una versión nueva cuando cambia "version" en package.json (push a main),
# o manualmente desde la pestaña Actions. Si la versión ya está publicada, no hace nada.
# La app instalada la detecta y ofrece actualizar con su botón.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Solo cuenta como publicada si existe y no es borrador (un borrador se reutiliza)
          $borrador = gh release view "v$v" --repo '${{ github.repository }}' --json isDraft -q .isDraft 2>$null
          $existe = ($LASTEXITCODE -eq 0 -and "$borrador".Trim() -eq 'false')
          "version=$v" >> $env:GITHUB_OUTPUT
          "existe=$($existe.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($existe) { Write-Host "v$v ya está publicada: no hay nada que hacer." } else { Write-Host "Se publicará v$v" }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.version.outputs.existe == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.version.outputs.existe == 'false'
        run: npm ci

      - name: Comprobar la app (incluye que la versión del motor coincida)
        if: steps.version.outputs.existe == 'false'
        run: npm test

      - name: Probar el motor (Windows PowerShell 5.1)
        if: steps.version.outputs.existe == 'false'
        shell: powershell
        run: ./tests/Test-Motor.ps1

      - name: Crear la etiqueta de la versión
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $t = 'v${{ steps.version.outputs.version }}'
          git fetch --tags --quiet
          if (-not (git tag -l $t)) {
            git tag $t
            git push origin $t
          }

      - name: Compilar el instalador y publicarlo en Releases
        if: steps.version.outputs.existe == 'false'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Añadir la versión de consola y hacer pública la versión
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $t = 'v${{ steps.version.outputs.version }}'
          $dir = 'dist/DoctorPC-Consola'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item engine/* $dir -Recurse
          Compress-Archive -Path "$dir/*" -DestinationPath dist/DoctorPC-Consola.zip -Force
          gh release upload $t dist/DoctorPC-Consola.zip --clobber --repo '${{ github.repository }}'
          # Comprobar que están los archivos que necesita el actualizador antes de publicar
          $assets = gh release view $t --repo '${{ github.repository }}' --json assets -q '.assets[].name'
          foreach ($a in 'DoctorPC-Instalador.exe', 'latest.yml') { if ($assets -notcontains $a) { throw "Falta $a en el release" } }
          gh release edit $t --repo '${{ github.repository }}' --draft=false --latest --title "Doctor PC ${{ steps.version.outputs.version }}" --notes-file build/release-notes.md
          Write-Host "Publicada $t"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
